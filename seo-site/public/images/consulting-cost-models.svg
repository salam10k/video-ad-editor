<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Five consulting pricing models compared by cost predictability">
  <rect width="1200" height="520" fill="#fbf8f3"/>
  <text x="600" y="60" text-anchor="middle" font-family="system-ui, sans-serif" font-size="34" font-weight="800" fill="#0f2a3d">Hourly · Daily · Retainer · Outcome · Fixed fee</text>
  <line x1="120" y1="420" x2="1080" y2="420" stroke="#0f2a3d" stroke-width="6"/>
  <g font-family="system-ui, sans-serif" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">
    <rect x="140" y="320" width="150" height="100" rx="12" fill="#5f7383"/><text x="215" y="380">Hourly</text>
    <rect x="330" y="280" width="150" height="140" rx="12" fill="#3d5568"/><text x="405" y="360">Daily</text>
    <rect x="520" y="230" width="150" height="190" rx="12" fill="#0f2a3d"/><text x="595" y="335">Retainer</text>
    <rect x="710" y="190" width="150" height="230" rx="12" fill="#9a3412"/><text x="785" y="315">Outcome</text>
    <rect x="900" y="130" width="150" height="290" rx="12" fill="#c2410c"/><text x="975" y="285">Fixed</text>
  </g>
  <text x="120" y="470" font-family="system-ui, sans-serif" font-size="24" fill="#3d5568">less predictable</text>
  <text x="1080" y="470" text-anchor="end" font-family="system-ui, sans-serif" font-size="24" fill="#3d5568">more predictable for the client</text>
</svg>
